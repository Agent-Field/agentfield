controlPlane:
  replicaCount: 1
  # Control-plane pod grace. Sized for shutdownMinDelay (5s) + the 30s
  # AGENTFIELD_SHUTDOWN_TIMEOUT drain + roughly 20s of shutdown tail.
  terminationGracePeriodSeconds: 60
  # Seconds the control plane keeps serving after SIGTERM before it starts
  # closing the listener, so kube-proxy can remove this pod from the Service
  # endpoints first. Accepts bare seconds or a Go duration. "0" (or "")
  # reproduces the previous shutdown timing exactly.
  shutdownMinDelay: 5s
  readinessProbe:
    # Default stays /api/v1/health so a chart upgrade against an older cached
    # image cannot 404 the probe and leave a single-replica Service with zero
    # endpoints. Switch to /api/v1/health/ready (or /readyz) once every node
    # runs a control-plane image newer than v0.1.137: that path also reports
    # 503 during the shutdown min-delay window, which /api/v1/health
    # deliberately does not.
    path: /api/v1/health
    # A draining pod must fail readiness before shutdownMinDelay closes the
    # listener. With one required failure and a two-second period, the next
    # probe marks it Unready within 2s and leaves about 3s for endpoint
    # propagation under the shipped 5s delay.
    periodSeconds: 2
    failureThreshold: 1

  image:
    repository: agentfield/control-plane
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    # Admin gRPC listens on (port + 100). Set to 0 to auto-compute.
    grpcPort: 0

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  storage:
    # local (SQLite/Bolt under AGENTFIELD_HOME) or postgres
    mode: local
    # If mode=postgres and this is empty, and postgres.enabled=true, the chart will auto-wire it.
    postgresUrl: ""

  env:
    AGENTFIELD_HOME: /data
    # Use defaults + env vars (avoids relying on a bundled config file).
    # You can set this to a real path if you mount your own config.
    AGENTFIELD_CONFIG_FILE: /dev/null

  extraEnv: []
  # AGENTFIELD_SHUTDOWN_MIN_DELAY may be set here instead of
  # controlPlane.shutdownMinDelay; the template suppresses its generated entry
  # so the rendered Pod never contains two variables with the same name.
  # - name: AGENTFIELD_AGENT_DRAIN_GRACE
  #   value: "60s"

  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  podAnnotations: {}
  annotations: {}

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  resources: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Reaching the control plane through a Service, Ingress or port-forward is not
# a local connection, so while this is disabled the endpoints that install
# packages or handle credentials (package install/update/uninstall, the secret
# store, agent env and agent config) refuse those callers. Enable it to manage
# the control plane from outside its own pod; everything else works either way.
apiAuth:
  enabled: false
  apiKey: ""
  existingSecret: ""
  existingSecretKey: apiKey

postgres:
  enabled: false
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: agentfield
    password: agentfield
    database: agentfield
    existingSecret: ""
    existingSecretUsernameKey: username
    existingSecretPasswordKey: password
    existingSecretDatabaseKey: database
  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

demoAgent:
  enabled: false
  terminationGracePeriodSeconds: 45
  image:
    # Build locally from deployments/docker/Dockerfile.demo-go-agent and push/load into your cluster.
    repository: agentfield-demo-go-agent
    tag: local
    pullPolicy: IfNotPresent
  nodeId: demo-go-agent
  extraEnv: []
  # - name: AGENTFIELD_SHUTDOWN_TIMEOUT
  #   value: "30s"
  service:
    type: ClusterIP
    port: 8001

demoPythonAgent:
  # Demo agent that installs the Python SDK from PyPI at startup (no custom image required).
  # Intended for evaluation only.
  enabled: false
  terminationGracePeriodSeconds: 45
  image:
    repository: python
    tag: "3.11-slim"
    pullPolicy: IfNotPresent
  pipPackage: "agentfield"
  nodeId: demo-python-agent
  extraEnv: []
  # - name: AGENTFIELD_SHUTDOWN_TIMEOUT
  #   value: "30s"
  service:
    type: ClusterIP
    port: 8001
