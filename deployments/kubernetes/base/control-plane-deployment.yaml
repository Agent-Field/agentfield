apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfield-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: control-plane
          image: agentfield/control-plane:latest
          args: ["server", "--open=false"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8180
          env:
            - name: AGENTFIELD_PORT
              value: "8080"
            - name: AGENTFIELD_HOME
              value: "/data"
            - name: AGENTFIELD_CONFIG_FILE
              value: "/dev/null"
            - name: AGENTFIELD_STORAGE_MODE
              value: "local"
            - name: AGENTFIELD_SHUTDOWN_MIN_DELAY
              value: "5s"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          # Keep the image-compatible default; opt in to shutdown-aware
          # readiness with /api/v1/health/ready after upgrading every image.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            # Once the path is switched to /api/v1/health/ready, one failed
            # probe marks the pod Unready within 2s of BeginDrain. That leaves
            # about 3s of the 5s minimum delay for endpoint propagation.
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 1
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agentfield-control-plane-data
