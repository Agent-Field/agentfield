name: LiteLLM Canary

# agentfield/litellm_observability.py reads LiteLLM's private
# logging_callback_manager and _known_custom_logger_compatible_callbacks.
# tests/test_litellm_observability.py catches upstream renames here instead of
# allowing them to surface first in a user's process.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-latest-litellm:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK with latest LiteLLM
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          # The langfuse extra makes the local ingestion test exercise the real
          # LiteLLM callback instead of accepting a missing-package no-op.
          pip install ".[dev,langfuse]" --upgrade litellm

      - name: Show LiteLLM version
        id: litellm
        working-directory: sdk/python
        run: |
          pip show litellm
          echo "version=$(python -c 'from importlib.metadata import version; print(version("litellm"))')" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: sdk/python
        run: ./scripts/run_pytest.sh

      - name: Open or update tracking issue
        if: steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          LITELLM_VERSION: ${{ steps.litellm.outputs.version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        with:
          script: |
            const title = `litellm canary failed: ${process.env.LITELLM_VERSION}`;
            const body = [
              `The weekly LiteLLM canary failed on Python ${process.env.PYTHON_VERSION}.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail canary
        if: steps.tests.outcome == 'failure'
        run: exit 1
