name: Release

on:
  # Automatic staging releases on push to main
  push:
    branches:
      - main
    paths:
      - 'control-plane/**'
      - 'sdk/**'
      - 'VERSION'
      - '.github/workflows/release.yml'

  # Manual releases (production or staging)
  workflow_dispatch:
    inputs:
      release_environment:
        description: 'Target environment (staging=prerelease, production=stable release)'
        type: choice
        options:
          - staging
          - production
        default: production
      release_component:
        description: 'Which part of the SemVer to bump (for new release lines)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease_label:
        description: 'Label for staging releases (e.g., rc, beta, alpha)'
        type: string
        default: 'rc'
      existing_version:
        description: 'Optional explicit version to reuse (skips bumping/pushing)'
        type: string
        required: false
      publish_pypi:
        description: 'Publish Python SDK to PyPI'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish TypeScript SDK (staging=@next, production=@latest)'
        type: boolean
        default: true
      publish_docker:
        description: 'Push Docker image (staging=staging-X.Y.Z, production=vX.Y.Z+latest)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.25.x'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      build_date: ${{ steps.version.outputs.build_date }}
      environment: ${{ steps.version.outputs.environment }}
      publish_pypi: ${{ steps.flags.outputs.publish_pypi }}
      publish_npm: ${{ steps.flags.outputs.publish_npm }}
      publish_docker: ${{ steps.flags.outputs.publish_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Python for tooling
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Determine publish flags
        id: flags
        env:
          # For push events, default to publishing everything
          # For workflow_dispatch, use the provided inputs
          INPUT_PUBLISH_PYPI: ${{ github.event.inputs.publish_pypi }}
          INPUT_PUBLISH_NPM: ${{ github.event.inputs.publish_npm }}
          INPUT_PUBLISH_DOCKER: ${{ github.event.inputs.publish_docker }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Default to true for push events (automatic staging releases)
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
            echo "publish_npm=true" >> "$GITHUB_OUTPUT"
            echo "publish_docker=true" >> "$GITHUB_OUTPUT"
          else
            # Use inputs for workflow_dispatch
            if [ "${INPUT_PUBLISH_PYPI}" = "true" ]; then
              echo "publish_pypi=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_pypi=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "${INPUT_PUBLISH_NPM}" = "true" ]; then
              echo "publish_npm=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_npm=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "${INPUT_PUBLISH_DOCKER}" = "true" ]; then
              echo "publish_docker=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_docker=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare release version
        id: version
        env:
          # For push events: default to staging with patch bump
          # For workflow_dispatch: use provided inputs
          INPUT_ENVIRONMENT: ${{ github.event.inputs.release_environment }}
          INPUT_COMPONENT: ${{ github.event.inputs.release_component }}
          INPUT_PRERELEASE_LABEL: ${{ github.event.inputs.prerelease_label }}
          INPUT_EXISTING_VERSION: ${{ github.event.inputs.existing_version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Determine environment and component based on trigger type
          if [ "${EVENT_NAME}" = "push" ]; then
            # Automatic staging release on push to main
            ENVIRONMENT="staging"
            COMPONENT="patch"
            PRERELEASE_LABEL="rc"
            EXISTING_VERSION=""
            echo "Automatic staging release triggered by push to main"
          else
            # Manual workflow_dispatch
            ENVIRONMENT="${INPUT_ENVIRONMENT:-production}"
            COMPONENT="${INPUT_COMPONENT:-patch}"
            PRERELEASE_LABEL="${INPUT_PRERELEASE_LABEL:-rc}"
            EXISTING_VERSION="${INPUT_EXISTING_VERSION:-}"
          fi

          if [ -n "${EXISTING_VERSION}" ]; then
            version="${EXISTING_VERSION}"
            tag="v${version}"
            git fetch --tags origin "refs/tags/${tag}:refs/tags/${tag}" --depth=1
            release_sha="$(git rev-list -n 1 "${tag}")"
          else
            if [ "${ENVIRONMENT}" = "staging" ]; then
              # Staging: Always create prerelease version
              CHANNEL="prerelease"
              LABEL="${PRERELEASE_LABEL:-rc}"
              cmd=(python scripts/bump_version.py --channel "${CHANNEL}" --component "${COMPONENT}" --prerelease-label "${LABEL}")
            else
              # Production: Create stable version (finalizes from prerelease if exists)
              CHANNEL="stable"
              cmd=(python scripts/bump_version.py --channel "${CHANNEL}" --component "${COMPONENT}")
            fi
            version="$("${cmd[@]}")"
            tag="v${version}"
            python scripts/update_changelog.py --version "${version}"
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(release): ${tag} [skip ci]"
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "HEAD:${REF_NAME}"
            git push origin "${tag}"
            release_sha="$(git rev-parse HEAD)"
          fi

          # sdk/go is a nested Go module. Go resolves its versions from tags
          # prefixed with the module subdirectory, not from the repository's
          # root vX.Y.Z tag. The generated Go scaffold pins this exact version,
          # so publish the matching nested tag before release artifacts are
          # built and users can run `af init`.
          sdk_go_tag="sdk/go/${tag}"
          if git show-ref --verify --quiet "refs/tags/${sdk_go_tag}"; then
            sdk_go_sha="$(git rev-list -n 1 "${sdk_go_tag}")"
            if [ "${sdk_go_sha}" != "${release_sha}" ]; then
              echo "${sdk_go_tag} already points to ${sdk_go_sha}, expected ${release_sha}" >&2
              exit 1
            fi
          else
            git tag -a "${sdk_go_tag}" "${release_sha}" -m "Go SDK ${tag}"
            git push origin "${sdk_go_tag}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  build-binaries:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            goreleaser_ids: '--id agentfield-linux-amd64 --id agentfield-linux-arm64'
          - os: macos-14
            label: darwin
            goreleaser_ids: '--id agentfield-darwin-amd64 --id agentfield-darwin-arm64 --id agentfield-tray-darwin-amd64 --id agentfield-tray-darwin-arm64'
    runs-on: ${{ matrix.os }}
    env:
      GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag_name }}
      GORELEASER_CURRENT_COMMIT: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: control-plane/go.sum

      - name: Verify Go SDK module release
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="v${{ needs.prepare.outputs.version }}"
          resolved="$(GOPROXY=direct GONOSUMDB=github.com/Agent-Field/agentfield/sdk/go go list -m -f '{{.Version}}' "github.com/Agent-Field/agentfield/sdk/go@${version}")"
          test "${resolved}" = "${version}"

      - name: Install cross-compilers
        if: matrix.label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: control-plane/web/client/package-lock.json

      - name: Build Web UI
        working-directory: control-plane/web/client
        run: |
          npm install
          npm run build

      - name: Run GoReleaser build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: build --clean --skip=validate --skip=before ${{ matrix.goreleaser_ids }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten binaries to dist root
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Original dist/ structure ==="
          ls -lah dist/

          # Move binaries from subdirectories to dist root
          find dist/ -type f -name "agentfield-*" -exec mv {} dist/ \; 2>/dev/null || true

          # Remove empty subdirectories
          find dist/ -mindepth 1 -type d -empty -delete 2>/dev/null || true

          echo ""
          echo "=== Flattened dist/ directory ==="
          ls -lah dist/agentfield-* 2>/dev/null || echo "No binaries found"

      - name: Rename artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/artifacts.json ]; then mv dist/artifacts.json dist/artifacts-${{ matrix.label }}.json; fi
          if [ -f dist/metadata.json ]; then mv dist/metadata.json dist/metadata-${{ matrix.label }}.json; fi
          if [ -f dist/config.yaml ]; then mv dist/config.yaml dist/config-${{ matrix.label }}.yaml; fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist

  publish:
    needs:
      - prepare
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag_name }}
      GORELEASER_CURRENT_COMMIT: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: control-plane/web/client/package-lock.json

      - name: Build Web UI
        working-directory: control-plane/web/client
        run: |
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist

      - name: Download darwin artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist

      - name: Merge binaries and create checksums
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloaded binaries:"
          ls -lah dist/

          cd dist
          sha256sum agentfield-* > checksums.txt
          cat checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.environment == 'staging' }}
          generate_release_notes: true
          body: |
            ${{ needs.prepare.outputs.environment == 'staging' && '> ⚠️ **This is a staging/pre-release version for testing. Not recommended for production use.**' || '' }}

            ## AgentField ${{ needs.prepare.outputs.version }}

            ### Installation

            ${{ needs.prepare.outputs.environment == 'staging' && '```bash
            # Staging binary (use --staging flag)
            curl -fsSL https://agentfield.ai/install.sh | bash -s -- --staging

            # Python SDK (prerelease - requires --pre flag)
            pip install --pre agentfield

            # TypeScript SDK
            npm install @agentfield/sdk@next
            ```' || '```bash
            curl -fsSL https://agentfield.ai/install.sh | bash
            ```' }}

            ### Version Pinning

            ```bash
            VERSION=${{ needs.prepare.outputs.tag_name }} curl -fsSL https://agentfield.ai/install.sh | bash
            ```

            ### Manual Download

            Download the binary for your platform below, make it executable, and move it to your PATH.

            ### Supported Platforms

            - **macOS Intel:** `agentfield-darwin-amd64`
            - **macOS Apple Silicon:** `agentfield-darwin-arm64`
            - **Linux x86_64:** `agentfield-linux-amd64`
            - **Linux ARM64:** `agentfield-linux-arm64`
          files: |
            dist/agentfield-*
            dist/checksums.txt

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-dist
          path: dist/

      - name: Build Python package
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist

      - name: Publish to PyPI
        if: needs.prepare.outputs.publish_pypi == 'true'
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload --skip-existing dist/*

      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Upload TypeScript SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-dist
          path: sdk/typescript/dist

      - name: Publish to npm (staging with @next tag)
        if: |
          needs.prepare.outputs.environment == 'staging' &&
          needs.prepare.outputs.publish_npm == 'true'
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish"
          else
            npm publish --provenance --access public --tag next
          fi

      - name: Publish to npm (production with @latest tag)
        if: |
          needs.prepare.outputs.environment == 'production' &&
          needs.prepare.outputs.publish_npm == 'true'
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm refuses to publish over an existing version, which turned a
        # re-run of this job after a Docker failure into a guaranteed failure.
        # PyPI already has --skip-existing above; give npm the same behaviour.
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Compute Docker metadata
        if: needs.prepare.outputs.publish_docker == 'true'
        id: docker_meta
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          set -euo pipefail
          image="agentfield/control-plane"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          if [ "${ENVIRONMENT}" = "staging" ]; then
            # Staging: use staging-X.Y.Z-rc.N prefix
            echo "tags=${image}:staging-${VERSION}" >> "$GITHUB_OUTPUT"
            echo "cloud_tags=${image}-cloud:staging-${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Production: version tag + latest
            echo "tags=${image}:${TAG_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
            echo "cloud_tags=${image}-cloud:${TAG_NAME},${image}-cloud:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push control plane image
        id: control_plane_image
        if: needs.prepare.outputs.publish_docker == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.control-plane
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.release_sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push control plane image (retry)
        if: needs.prepare.outputs.publish_docker == 'true' && steps.control_plane_image.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.control-plane
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.release_sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push control plane cloud image
        id: control_plane_cloud_image
        if: needs.prepare.outputs.publish_docker == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.control-plane-cloud
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.cloud_tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.release_sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push control plane cloud image (retry)
        if: needs.prepare.outputs.publish_docker == 'true' && steps.control_plane_cloud_image.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.control-plane-cloud
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.cloud_tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.release_sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach Python artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            sdk/python/dist/*.whl
            sdk/python/dist/*.tar.gz

  # Desktop installers — DMG + zip on macOS (Apple Silicon), NSIS .exe on
  # Windows (x64), attached to the same release as the CLI binaries so users
  # download whichever they want. Runs for staging (RC prereleases) and
  # production alike. The bundled af CLI is built from the release commit with
  # the embedded web UI + sqlite FTS (parity with build-single-binary.sh), so
  # the installed app is fully self-contained on a fresh machine.
  #
  # macOS builds are Developer ID signed + notarized via the CSC_LINK /
  # CSC_KEY_PASSWORD / APPLE_* secrets. Windows builds are still unsigned
  # (Authenticode is a separate follow-up).
  desktop-installers:
    needs:
      - prepare
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            assets: desktop/release/*.dmg desktop/release/*.zip
          - os: windows-latest
            assets: desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: control-plane/go.sum

      - name: Ensure C toolchain for CGO (sqlite FTS in the bundled CLI)
        if: runner.os == 'Windows'
        shell: bash
        run: gcc --version || choco install mingw -y --no-progress

      - name: Build Web UI (embedded into the bundled CLI)
        working-directory: control-plane/web/client
        run: |
          npm install
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Stamp release version into the app
        working-directory: desktop
        shell: bash
        # Installer filenames and the app's About version follow the release,
        # not the static version in package.json.
        run: npm version --no-git-tag-version "${{ needs.prepare.outputs.version }}"

      - name: Bundle af CLI (embedded UI + FTS)
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
          # Stamp the bundled CLI with the release version (goreleaser
          # parity). Without it the binary answers `Version: dev` and the
          # app can neither min-version-gate it nor ever update over it.
          AF_CLI_VERSION: ${{ needs.prepare.outputs.tag_name }}
        run: npm run bundle-cli -- full

      # One-click Railway deploy needs OpenTofu + the Railway provider in
      # vendor/deploy-engine so extraResources can pack them into the app.
      - name: Fetch deploy engine (OpenTofu + Railway provider)
        working-directory: desktop
        run: npm run fetch:deploy-engine

      # electron-builder silently skips a missing extraResources source, so a
      # broken or removed fetch would ship installers whose Remote tab says
      # "one-click deploy isn't bundled" (every build up to v0.1.118 did).
      # Fail the release here instead of degrading the artifact.
      - name: Assert deploy engine is bundled
        working-directory: desktop
        shell: bash
        # Plain file tests only: this step runs under bash -e -o pipefail,
        # where an `ls existing missing | grep` pipeline reports the missing
        # arg's exit status even when the other file exists (the v0.1.119
        # false positive that blocked the macOS DMG).
        run: |
          if [ ! -f vendor/deploy-engine/tofu ] && [ ! -f vendor/deploy-engine/tofu.exe ]; then
            echo "::error::vendor/deploy-engine has no tofu binary; run fetch:deploy-engine"
            exit 1
          fi
          if [ ! -d vendor/deploy-engine/providers ]; then
            echo "::error::vendor/deploy-engine/providers mirror is missing; offline provider install would fail"
            exit 1
          fi

      # electron-builder signs every Mach-O in the bundle (including the
      # bundled af/af-tray) with the Developer ID cert + hardened runtime,
      # then notarizes and staples the .app before packing DMG/zip from it.
      # Missing secrets degrade the artifact instead of blocking the release:
      # no CSC_LINK → unsigned (ad-hoc) build, no APPLE_APP_SPECIFIC_PASSWORD
      # → signed but un-notarized build, each with a workflow warning.
      #
      # Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false for this step. It reads as
      # "don't guess an identity from the keychain", but electron-builder treats
      # it as "skip code signing entirely" even when CSC_LINK is supplied — the
      # app then gets ad-hoc signed, and notarization of an unsigned app comes
      # back Invalid. That is what happened to v0.1.118-rc.10, which shipped
      # without its macOS DMG. Providing CSC_LINK is already explicit, so
      # nothing is auto-discovered here.
      - name: Build installers (macOS, signed + notarized)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] \
            || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::signing/notarization secrets incomplete; producing an unsigned build"
            # Partial APPLE_* env makes electron-builder hard-fail, and an
            # unsigned app can never notarize; drop the set entirely so it
            # degrades to a skip-with-warning instead. Auto-discovery stays off
            # so an unsigned build cannot silently pick up a keychain identity.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run dist

      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          # Windows releases are unsigned; keep electron-builder from picking up
          # any identity that happens to be on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      # The .app inside the DMG is already notarized + stapled; notarizing and
      # stapling the DMG container as well makes the download pass Gatekeeper
      # even offline. Then hard-verify what is about to ship: a signing or
      # notarization regression must fail the release here, not on users'
      # machines.
      - name: Notarize DMG + verify Gatekeeper acceptance (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Same condition as the build step above. If they disagree, an
          # incomplete secret set produces an unsigned app here and then fails
          # the release on a notarization rejection instead of degrading to a
          # warning.
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] \
            || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::signing/notarization secrets incomplete; skipping DMG notarization and Gatekeeper verification"
            exit 0
          fi
          shopt -s nullglob
          dmgs=(desktop/release/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "no dmg found under desktop/release" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            # `notarytool submit --wait` exits 0 even when Apple answers
            # Invalid, so the status has to be read out of the output rather
            # than inferred from the exit code. rc.10 sailed past this point and
            # only failed later in `stapler`, which reports a ticket lookup
            # error instead of the actual rejection.
            submit_log="$(mktemp)"
            # `|| true` so that a hard notarytool failure still reaches the
            # status check below and gets its reason printed, rather than
            # tripping `set -e` with no explanation.
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait 2>&1 | tee "$submit_log" || true
            status="$(sed -n 's/^ *status: *//p' "$submit_log" | tail -1)"
            if [ "$status" != "Accepted" ]; then
              echo "::error::notarization of $dmg returned '${status:-unknown}'; Apple's report follows"
              submission_id="$(sed -n 's/^ *id: *//p' "$submit_log" | head -1)"
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
              fi
              exit 1
            fi
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          apps=(desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "no packed .app found under desktop/release" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          done

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(${{ matrix.assets }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found under desktop/release" >&2
            ls -la desktop/release || true
            exit 1
          fi
          ls -lah "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
